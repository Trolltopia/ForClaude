name: Price and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every morning, after Scryfall's overnight price update.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Until Pages is switched on (Settings → Pages → Source: GitHub Actions) there's
  # nowhere to deploy, so skip quietly instead of failing every morning.
  pages:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't enabled yet. Turn it on under Settings → Pages (Source: GitHub Actions), then run this workflow again."
          fi

  build:
    needs: pages
    if: needs.pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # About 160 sets at Scryfall's pace of two requests a second.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build price snapshots
        run: npm run data

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          # "/<repo>" for a project site, "" for a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
