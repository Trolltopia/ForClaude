name: Data check

# Builds snapshots for a few sets against the live APIs (MTGJSON, Scryfall, TCGCSV)
# and prints a breakdown, without deploying anything. Runs when the pipeline changes.
on:
  workflow_dispatch:
    inputs:
      sets:
        description: Set codes to build, space-separated, or "all"
        default: fra fdn woe
      report:
        description: Print each slot, the top cards and the sealed list
        type: boolean
        default: true
  push:
    branches-ignore: [main]
    paths:
      - "scripts/**"
      - "src/lib/data/**"
      - "src/lib/engine/**"
      - "src/sets/**"

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and report
        run: |
          SETS="${{ github.event.inputs.sets || 'fra fdn woe' }}"
          if [ "$SETS" = "all" ]; then SETS=""; fi
          REPORT="--report"
          if [ "${{ github.event.inputs.report }}" = "false" ]; then REPORT=""; fi
          npm run data -- $REPORT $SETS
